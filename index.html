<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Примеры дизайна | Ривьера Холл</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0A0A;
            --surface: #141414;
            --text-main: #FFFFFF;
            --accent: #5c95c4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            padding: 60px 20px 100px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            font-weight: 400;
            text-align: center;
            margin-bottom: 60px;
            color: var(--text-main);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 30px;
            text-decoration: none;
            color: var(--text-main);
            text-align: center;
            font-size: 1.1rem;
            font-weight: 400;
            transition: all 0.3s ease;
        }

        .card:hover {
            background: rgba(92, 149, 196, 0.1);
            border-color: var(--accent);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Варианты дизайна</h1>
        
        <div class="grid">
            <a href="1 версия/index.html" class="card" target="_blank">Пример дизайна 1</a>
            <a href="2 версия/index.html" class="card" target="_blank">Пример дизайна 2</a>
            <a href="3 версия/index.html" class="card" target="_blank">Пример дизайна 3</a>
            <a href="4 версия/index.html" class="card" target="_blank">Пример дизайна 4</a>
            <a href="5 версия/index.html" class="card" target="_blank">Пример дизайна 5</a>
            <a href="6 версия/index.html" class="card" target="_blank">Пример дизайна 6</a>
            <a href="7 версия/index.html" class="card" target="_blank">Пример дизайна 7</a>
            <a href="9 версия/index.html" class="card" target="_blank">Пример дизайна 9</a>
            <a href="10 версия/index.html" class="card" target="_blank">Пример дизайна 10</a>
            <a href="11 версия/index.html" class="card" target="_blank">Пример дизайна 11</a>
            <a href="12 версия/index.html" class="card" target="_blank">Пример дизайна 12</a>
            <a href="13 версия/index.html" class="card" target="_blank">Пример дизайна 13</a>
            <a href="14 версия/index.html" class="card" target="_blank">Пример дизайна 14</a>
            <a href="15 версия/index.html" class="card" target="_blank">Пример дизайна 15</a>
            <a href="16 версия/index.html" class="card" target="_blank">Пример дизайна 16</a>
        </div>

</body>
