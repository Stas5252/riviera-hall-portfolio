<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Страница не найдена · Ривьера Холл</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#173A67">
<link rel="icon" href="/favicon/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css?v=13">
<style>
  .nf{
    min-height:100svh;min-height:100vh;display:grid;place-content:center;justify-items:center;
    gap:clamp(18px,3vw,30px);text-align:center;
    padding:calc(40px + env(safe-area-inset-top)) var(--gap) calc(40px + env(safe-area-inset-bottom));
    background:var(--ink-deep);color:#fff;
  }
  .nf__wave{width:clamp(120px,30vw,190px);height:auto}
  .nf__code{font-family:'Proletarsk',serif;font-size:clamp(64px,18vw,140px);line-height:.9;letter-spacing:-.02em}
  .nf__text{margin:0;max-width:34ch;color:rgba(255,255,255,.7);font-size:clamp(14px,3.6vw,16px);line-height:1.6}
  .nf__row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:clamp(8px,2vw,16px)}
  .nf__btn{
    display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;
    border-radius:100px;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    transition:background .4s var(--ease),color .4s,border-color .4s;
  }
  .nf__btn--main{background:#fff;color:var(--ink)}
  .nf__btn--ghost{border:1px solid rgba(255,255,255,.4);color:#fff}
  @media (hover:hover){
    .nf__btn--main:hover{background:var(--sky)}
    .nf__btn--ghost:hover{border-color:#fff;background:rgba(255,255,255,.1)}
  }
</style>
</head>
<body>

<main class="nf">
  <svg class="nf__wave" viewBox="0 0 120 26" fill="none" aria-hidden="true">
    <path d="M3 18C13 1 33 1 45 12s31 12 42 1c5-5 12-6 15-2" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="120" y2="0"><stop stop-color="#96B7DA"/><stop offset="1" stop-color="#358BC1"/></linearGradient></defs>
  </svg>

  <p class="nf__code">404</p>
  <h1 class="nf__text" style="font-size:inherit;font-weight:400">Такой страницы нет.
  Возможно, ссылка устарела или в адресе опечатка.</h1>

  <div class="nf__row">
    <a href="/" class="nf__btn nf__btn--main">На главную</a>
    <a href="/#book" class="nf__btn nf__btn--ghost">Забронировать дату</a>
  </div>
</main>

</body>
</html>
